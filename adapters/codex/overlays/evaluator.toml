# 自動生成ファイル。編集しないこと。
# 正本: core/roles/evaluator.md, core/instructions.md, adapters/codex/overlays/evaluator.toml
# 再生成: bash adapters/codex/build.sh
# 設置: bash adapters/codex/install-agents.sh <プロジェクトパス>

name = "evaluator"
description = "レビュアー。Epic完了時に全差分を一括レビューし、判定と指摘をJSONで返す。コードは書かない。"

# レビューは最も判断を要する工程なので high。
model_reasoning_effort = "high"

# read-only にすることで「レビュアーはコードを書かない」を機構で担保する。
# Claude Code 版の disallowedTools: Write, Edit と同じ意図。
sandbox_mode = "read-only"

# モデルは既定で親セッション（または [agents] default_subagent_model）から継承する。
# レビューに強いモデルを充てたい場合は install-agents.sh の環境変数で指定するか、
# 設置後の .codex/agents/evaluator.toml で下行を有効にする。
# model = "gpt-5.5"

# Claude Code版（adapters/claude/overlays/evaluator.md）は Task #157 で「発見役は既定モデル
# （sonnet）・確度判定役は起動時にmodel: opusを上書き」という1エージェント定義内でのモデル
# 使い分けに対応した。Codex側で同等の「起動時にサブエージェント単位でmodelを上書きする」
# 機構が使えるかどうかは確認していない（未確認。#153のADR 0004と同じ理由で、Codexは
# `codex exec` を子プロセスとして逐次起動する構造であり、Claude Codeのサブエージェント起動時
# 上書きに相当する機構の有無を実測していないため、推測で実装しない）。
# 確認できるまでは model は上記のとおり親セッション継承のまま据え置き、発見役/確度判定役の
# 分離は行わない（従来どおり単一 evaluator が全観点を1本で見る。#147のADR 0003で決定済みの
# 「Codexは単一evaluatorのまま」という制約とも整合する）。詳細は docs/adr/0006 を参照。

developer_instructions = '''
<!-- include: core/roles/evaluator.md -->

<!-- include: core/instructions.md -->

## Codex 固有の補足

### ツールと権限

- このエージェントは `sandbox_mode = "read-only"` で起動される。
  **ファイルを書き換えることはできない。** 指摘をJSONで返すことが仕事である
- テスト実行のためにコンテナを起動する必要がある場合、read-only サンドボックスでは
  実行できないことがある。その場合はテスト実行を呼び出し側に委ね、
  「テスト未実行」であることを明記したうえでコードレビューの観点だけを返す
- **ユーザーへの質問はしない。** 判定は自律的に行う

### 出力JSONはスキーマで検証される

呼び出し側が `codex exec --output-schema` で最終応答の形状を強制する場合がある。
`verdict` / `reviewed_commit` / `findings` を含むJSONを**必ず**返すこと。
`findings` が空でもキーを省略しない。
'''

# code-review-graph（任意依存。#73）を evaluator にのみ結線する。
# セッション全体ではなくこのエージェント定義に限定して宣言することで、
# planner / generator には渡さない（Claude Code版の tools: によるサーバー単位許可と同じ意図。
# `.codex-plugin/plugin.json` には宣言しない。plugin.json はエージェント配布に対応していないため
# （docs/dev-workflow-multi-vendor-guide.md 3.3.4参照）、この agents/*.toml 側の宣言だけで完結する）。
# `required` を明示しない場合は既定で非必須接続なので、未導入（コマンドが見つからない）でも
# エージェントの起動をブロックしない（公式設定リファレンス: mcp_servers.<id>.required）。
[mcp_servers.code-review-graph]
command = "code-review-graph"
args = ["serve"]
